<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="55%" stop-color="#4FB8E8"/>
      <stop offset="100%" stop-color="#FFC72C"/>
    </linearGradient>
    <style>
      .fraunces { font-family: 'Fraunces', Georgia, serif; }
      .manrope { font-family: 'Manrope', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <rect width="390" height="844" fill="#14231A"/>
  <rect x="0" y="0" width="390" height="230" fill="url(#sky)"/>
  <path d="M0,230 C70,218 130,244 195,232 C260,220 330,242 390,226 L390,844 L0,844 Z" fill="#14231A"/>

  <!-- status bar -->
  <text x="24" y="34" class="manrope" font-size="15" fill="#F1FBF4" font-weight="600">9:41</text>
  <circle cx="352" cy="29" r="3" fill="#F1FBF4"/>
  <rect x="330" y="25" width="14" height="9" rx="2" fill="none" stroke="#F1FBF4" stroke-width="1"/>
  <rect x="308" y="25" width="14" height="9" rx="2" fill="none" stroke="#F1FBF4" stroke-width="1"/>
  <text x="366" y="34" text-anchor="end" class="manrope" font-size="13" fill="#F1FBF4" opacity="0.85">Pular</text>

  <!-- sprout above ground -->
  <g transform="translate(195,222)">
    <path d="M0,0 L0,-34" stroke="#2E9E4F" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M0,-14 C-17,-23 -23,-8 -8,2 C-2,-2 -2,-9 0,-14 Z" fill="#2E9E4F"/>
    <path d="M0,-22 C17,-31 23,-16 8,-6 C2,-10 2,-17 0,-22 Z" fill="#6FCF87"/>
  </g>

  <!-- root system below ground -->
  <g fill="none" stroke="#E1571C" stroke-width="2.6" stroke-linecap="round">
    <path d="M195,232 C188,270 205,300 190,336"/>
    <path d="M190,336 C178,362 158,372 140,398"/>
    <path d="M190,336 C200,364 222,376 236,404"/>
    <path d="M195,232 C210,258 232,262 248,286"/>
    <path d="M195,232 C180,256 158,258 144,282"/>
    <path d="M140,398 C130,418 108,424 92,446"/>
    <path d="M236,404 C246,424 268,428 284,450"/>
  </g>
  <g fill="#2E9E4F">
    <circle cx="140" cy="398" r="4.4"/>
    <circle cx="236" cy="404" r="4.4"/>
    <circle cx="92" cy="446" r="3.6"/>
    <circle cx="284" cy="450" r="3.6"/>
    <circle cx="248" cy="286" r="3.6"/>
    <circle cx="144" cy="282" r="3.6"/>
    <circle cx="190" cy="336" r="5"/>
  </g>

  <!-- text block -->
  <text x="32" y="520" class="fraunces" font-size="27" font-weight="600" fill="#F1FBF4">
    <tspan x="32" dy="0">O carbono do Cerrado</tspan>
    <tspan x="32" dy="34">cresce debaixo da terra</tspan>
  </text>
  <text x="32" y="592" class="manrope" font-size="15" fill="#F1FBF4" opacity="0.8">
    <tspan x="32" dy="0">A Raiz mostra o que suas ações</tspan>
    <tspan x="32" dy="22">realmente capturam — mesmo</tspan>
    <tspan x="32" dy="22">o que ninguém vê acima do solo.</tspan>
  </text>

  <circle cx="178" cy="700" r="4" fill="#FFC72C"/>
  <circle cx="195" cy="700" r="4" fill="#F1FBF4" opacity="0.35"/>
  <circle cx="212" cy="700" r="4" fill="#F1FBF4" opacity="0.35"/>

  <rect x="32" y="740" width="326" height="56" rx="16" fill="#2E9E4F"/>
  <text x="195" y="774" text-anchor="middle" class="manrope" font-size="16" font-weight="700" fill="#F1FBF4">Começar</text>

  <rect x="150" y="822" width="90" height="4" rx="2" fill="#F1FBF4" opacity="0.5"/>
</svg>
