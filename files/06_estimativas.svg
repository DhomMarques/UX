<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E9E4F" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2E9E4F" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .fraunces { font-family: 'Fraunces', Georgia, serif; }
      .manrope { font-family: 'Manrope', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <rect width="390" height="844" fill="#F5FBFF"/>

  <text x="24" y="34" class="manrope" font-size="14" fill="#163C2B" font-weight="600">9:41</text>
  <rect x="330" y="25" width="14" height="9" rx="2" fill="none" stroke="#163C2B" stroke-width="1"/>

  <text x="24" y="68" class="fraunces" font-size="21" font-weight="600" fill="#163C2B">Estimativas de carbono</text>

  <text x="24" y="104" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Capturado até agora</text>
  <text x="24" y="140" class="fraunces" font-size="32" font-weight="600" fill="#163C2B">1.240 kg de CO₂</text>
  <text x="24" y="160" class="manrope" font-size="12" fill="#2E9E4F">a partir de 412 árvores registradas</text>

  <g transform="translate(24,182)">
    <rect width="342" height="176" rx="16" fill="#FFFFFF" stroke="#DCEFE3" stroke-width="1.4"/>
    <line x1="20" y1="30" x2="322" y2="30" stroke="#EAF6FF" stroke-width="1"/>
    <line x1="20" y1="80" x2="322" y2="80" stroke="#EAF6FF" stroke-width="1"/>
    <line x1="20" y1="130" x2="322" y2="130" stroke="#EAF6FF" stroke-width="1"/>

    <path d="M20,128 C60,120 90,110 120,96 C150,84 170,72 200,56 L200,148 L20,148 Z" fill="url(#areaFill)"/>
    <path d="M20,128 C60,120 90,110 120,96 C150,84 170,72 200,56" fill="none" stroke="#2E9E4F" stroke-width="2.6"/>

    <path d="M200,56 C230,42 260,30 300,16" fill="none" stroke="#FFC72C" stroke-width="2.4" stroke-dasharray="5 5"/>
    <circle cx="200" cy="56" r="4.5" fill="#163C2B"/>

    <text x="200" y="42" text-anchor="middle" class="manrope" font-size="9" fill="#163C2B" opacity="0.6">hoje</text>
    <text x="300" y="10" text-anchor="end" class="manrope" font-size="9" fill="#C99400">projeção</text>

    <text x="20" y="166" class="manrope" font-size="10" fill="#163C2B" opacity="0.5">Jan/25</text>
    <text x="200" y="166" text-anchor="middle" class="manrope" font-size="10" fill="#163C2B" opacity="0.5">Set/26</text>
    <text x="322" y="166" text-anchor="end" class="manrope" font-size="10" fill="#163C2B" opacity="0.5">Set/31</text>
  </g>

  <text x="24" y="392" class="manrope" font-size="12" fill="#163C2B" opacity="0.75">Em 5 anos, no ritmo atual, suas árvores devem capturar cerca de 8.600 kg de CO₂.</text>

  <g transform="translate(24,418)">
    <rect width="342" height="128" rx="16" fill="#163C2B"/>
    <text x="20" y="30" class="manrope" font-size="12" fill="#FFC72C">Meta atual</text>
    <text x="20" y="54" class="fraunces" font-size="17" font-weight="600" fill="#FFFFFF">5.000 kg de CO₂ até dez/2027</text>
    <rect x="20" y="66" width="302" height="8" rx="4" fill="#22371F"/>
    <rect x="20" y="66" width="75" height="8" rx="4" fill="#FFC72C"/>
    <text x="20" y="92" class="manrope" font-size="12" fill="#FFFFFF" opacity="0.9">24,8% concluído</text>

    <line x1="20" y1="102" x2="322" y2="102" stroke="#2C4A34"/>
    <text x="20" y="118" class="manrope" font-size="11" fill="#FFFFFF" opacity="0.75">Faltam 3.760 kg de CO₂</text>
    <text x="322" y="118" text-anchor="end" class="manrope" font-size="11" fill="#FFFFFF" opacity="0.75">≈ 1.253 árvores no ritmo atual</text>
  </g>

  <text x="24" y="580" class="fraunces" font-size="17" font-weight="600" fill="#163C2B">Captura por espécie</text>

  <g transform="translate(24,598)" class="manrope">
    <text x="0" y="14" font-size="12" fill="#163C2B">Ipê-amarelo</text>
    <text x="342" y="14" text-anchor="end" font-size="12" fill="#163C2B" opacity="0.6">420 kg</text>
    <rect x="0" y="20" width="342" height="6" rx="3" fill="#EAF6FF"/>
    <rect x="0" y="20" width="230" height="6" rx="3" fill="#2E9E4F"/>

    <text x="0" y="52" font-size="12" fill="#163C2B">Barbatimão</text>
    <text x="342" y="52" text-anchor="end" font-size="12" fill="#163C2B" opacity="0.6">310 kg</text>
    <rect x="0" y="58" width="342" height="6" rx="3" fill="#EAF6FF"/>
    <rect x="0" y="58" width="170" height="6" rx="3" fill="#1E88E5"/>

    <text x="0" y="90" font-size="12" fill="#163C2B">Aroeira</text>
    <text x="342" y="90" text-anchor="end" font-size="12" fill="#163C2B" opacity="0.6">280 kg</text>
    <rect x="0" y="96" width="342" height="6" rx="3" fill="#EAF6FF"/>
    <rect x="0" y="96" width="150" height="6" rx="3" fill="#FFC72C"/>

    <text x="0" y="128" font-size="12" fill="#163C2B">Pequi</text>
    <text x="342" y="128" text-anchor="end" font-size="12" fill="#163C2B" opacity="0.6">230 kg</text>
    <rect x="0" y="134" width="342" height="6" rx="3" fill="#EAF6FF"/>
    <rect x="0" y="134" width="120" height="6" rx="3" fill="#E1571C"/>
  </g>

  <rect x="0" y="768" width="390" height="76" fill="#FFFFFF"/>
  <line x1="0" y1="768" x2="390" y2="768" stroke="#DCEFE3"/>
  <g transform="translate(56,795)">
    <path d="M-10,10 L0,0 L10,10 L10,22 L-10,22 Z" fill="none" stroke="#163C2B" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
    <text x="0" y="40" text-anchor="middle" class="manrope" font-size="11" fill="#163C2B" opacity="0.6">Quintal</text>
  </g>
  <g transform="translate(148,795)">
    <circle cx="0" cy="10" r="16" fill="none" stroke="#163C2B" stroke-width="1.6" opacity="0.5"/>
    <path d="M-7,10 L7,10 M0,3 L0,17" stroke="#163C2B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <text x="0" y="40" text-anchor="middle" class="manrope" font-size="11" fill="#163C2B" opacity="0.6">Registrar</text>
  </g>
  <g transform="translate(242,795)">
    <path d="M-9,20 L-9,4 M0,20 L0,-2 M9,20 L9,10" stroke="#2E9E4F" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="40" text-anchor="middle" class="manrope" font-size="11" fill="#2E9E4F">Estimativas</text>
  </g>
  <g transform="translate(334,795)">
    <rect x="-9" y="0" width="18" height="22" rx="2" fill="none" stroke="#163C2B" stroke-width="1.6" opacity="0.5"/>
    <path d="M-5,6 L5,6 M-5,11 L5,11 M-5,16 L1,16" stroke="#163C2B" stroke-width="1.4" opacity="0.5"/>
    <text x="0" y="40" text-anchor="middle" class="manrope" font-size="11" fill="#163C2B" opacity="0.6">Relatório</text>
  </g>

  <rect x="150" y="828" width="90" height="4" rx="2" fill="#163C2B" opacity="0.3"/>
</svg>
