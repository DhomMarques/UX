<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .fraunces { font-family: 'Fraunces', Georgia, serif; }
      .manrope { font-family: 'Manrope', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <rect width="390" height="844" fill="#F5FBFF"/>

  <text x="24" y="34" class="manrope" font-size="14" fill="#163C2B" font-weight="600">9:41</text>
  <rect x="330" y="25" width="14" height="9" rx="2" fill="none" stroke="#163C2B" stroke-width="1"/>

  <text x="24" y="66" class="fraunces" font-size="20" font-weight="600" fill="#163C2B">Registrar plantio</text>
  <text x="366" y="66" text-anchor="end" class="manrope" font-size="14" fill="#163C2B" opacity="0.55">Cancelar</text>

  <!-- Foto -->
  <text x="24" y="92" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Foto da muda</text>
  <rect x="24" y="100" width="342" height="100" rx="16" fill="#FFFFFF" stroke="#DCEFE3" stroke-width="1.4" stroke-dasharray="6 5"/>
  <g transform="translate(195,150)">
    <rect x="-22" y="-14" width="44" height="32" rx="6" fill="none" stroke="#2E9E4F" stroke-width="2"/>
    <circle cx="0" cy="2" r="9" fill="none" stroke="#2E9E4F" stroke-width="2"/>
    <rect x="-8" y="-20" width="16" height="8" rx="2" fill="none" stroke="#2E9E4F" stroke-width="2"/>
  </g>
  <text x="195" y="188" text-anchor="middle" class="manrope" font-size="11" fill="#163C2B" opacity="0.55">Toque para fotografar a muda</text>

  <!-- Nome -->
  <text x="24" y="220" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Nome da planta</text>
  <rect x="24" y="228" width="342" height="42" rx="12" fill="#FFFFFF" stroke="#DCEFE3" stroke-width="1.4"/>
  <text x="40" y="254" class="manrope" font-size="13" fill="#163C2B" opacity="0.4">Ex: Ipê do pátio 3</text>

  <!-- Data -->
  <text x="24" y="288" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Data do plantio</text>
  <rect x="24" y="296" width="342" height="42" rx="12" fill="#FFFFFF" stroke="#DCEFE3" stroke-width="1.4"/>
  <text x="40" y="322" class="manrope" font-size="13" fill="#163C2B">02/09/2026</text>
  <g transform="translate(336,317)" stroke="#1E88E5" stroke-width="1.6" fill="none">
    <rect x="-8" y="-7" width="16" height="14" rx="2"/>
    <path d="M-8,-2 L8,-2"/>
  </g>

  <!-- Espécie -->
  <text x="24" y="356" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Espécie</text>
  <rect x="24" y="364" width="342" height="42" rx="12" fill="#FFFFFF" stroke="#DCEFE3" stroke-width="1.4"/>
  <text x="40" y="390" class="manrope" font-size="13" fill="#163C2B">Ipê-amarelo</text>
  <path d="M340,382 L348,390 L356,382" stroke="#163C2B" stroke-width="1.6" fill="none" opacity="0.5"/>

  <!-- Nome científico -->
  <text x="24" y="424" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Nome científico</text>
  <rect x="128" y="418" width="98" height="16" rx="8" fill="#EAF6FF"/>
  <text x="136" y="430" class="manrope" font-size="9" fill="#1E88E5">preenchido pela espécie</text>
  <rect x="24" y="432" width="342" height="36" rx="12" fill="#F5FBFF" stroke="#DCEFE3" stroke-width="1.2"/>
  <text x="40" y="455" class="manrope" font-size="12" fill="#163C2B" opacity="0.55" font-style="italic">Handroanthus albus</text>

  <!-- Local -->
  <text x="24" y="490" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Local do plantio</text>
  <rect x="24" y="498" width="342" height="56" rx="14" fill="#FFFFFF" stroke="#DCEFE3" stroke-width="1.4"/>
  <g transform="translate(48,526)">
    <path d="M0,-12 C7,-12 12,-7 12,-2 C12,7 0,16 0,16 C0,16 -12,7 -12,-2 C-12,-7 -7,-12 0,-12 Z" fill="#E1571C"/>
    <circle cx="0" cy="-3" r="4" fill="#FFFFFF"/>
  </g>
  <text x="74" y="518" class="manrope" font-size="12" fill="#163C2B">15°45'58"S, 47°52'01"W</text>
  <text x="74" y="534" class="manrope" font-size="10" fill="#163C2B" opacity="0.55">Localização atual do dispositivo · 6 m de precisão</text>
  <text x="342" y="530" text-anchor="end" class="manrope" font-size="11" fill="#1E88E5">Atualizar</text>

  <!-- Quem plantou -->
  <text x="24" y="586" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Quem plantou</text>
  <rect x="24" y="594" width="167" height="38" rx="12" fill="#2E9E4F"/>
  <text x="107" y="618" text-anchor="middle" class="manrope" font-size="13" font-weight="700" fill="#FFFFFF">Eu</text>
  <rect x="199" y="594" width="167" height="38" rx="12" fill="#FFFFFF" stroke="#DCEFE3" stroke-width="1.4"/>
  <text x="282" y="618" text-anchor="middle" class="manrope" font-size="13" fill="#163C2B" opacity="0.6">Outra pessoa</text>

  <!-- Participantes -->
  <text x="24" y="654" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Quem participou do plantio</text>
  <g transform="translate(24,662)">
    <circle cx="16" cy="16" r="16" fill="#2E9E4F"/>
    <text x="16" y="21" text-anchor="middle" class="manrope" font-size="11" fill="#FFFFFF" font-weight="700">CB</text>
    <circle cx="66" cy="16" r="16" fill="#1E88E5"/>
    <text x="66" y="21" text-anchor="middle" class="manrope" font-size="11" fill="#FFFFFF" font-weight="700">MS</text>
    <circle cx="116" cy="16" r="16" fill="#FFC72C"/>
    <text x="116" y="21" text-anchor="middle" class="manrope" font-size="11" fill="#163C2B" font-weight="700">LP</text>
    <circle cx="166" cy="16" r="16" fill="none" stroke="#163C2B" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.4"/>
    <path d="M166,9 L166,23 M159,16 L173,16" stroke="#163C2B" stroke-width="1.6" opacity="0.55"/>
  </g>

  <!-- Compartilhar -->
  <text x="24" y="726" class="manrope" font-size="12" fill="#163C2B" opacity="0.6">Compartilhar essa ação</text>
  <g transform="translate(24,734)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#E1306C" stroke-width="1.6"/>
    <rect x="9" y="10" width="18" height="16" rx="4" fill="none" stroke="#E1306C" stroke-width="1.6"/>
    <circle cx="18" cy="18" r="4.4" fill="none" stroke="#E1306C" stroke-width="1.6"/>

    <circle cx="66" cy="18" r="18" fill="#FFFFFF" stroke="#163C2B" stroke-width="1.6"/>
    <path d="M62,10 C62,10 70,10 70,18 C70,24 64,26 62,24 L62,10 Z M62,10 C62,10 58,8 58,14" fill="none" stroke="#163C2B" stroke-width="1.6" stroke-linecap="round"/>

    <circle cx="114" cy="18" r="18" fill="#FFFFFF" stroke="#25D366" stroke-width="1.6"/>
    <path d="M105,26 L107,20 C104,15 106,9 112,9 C118,9 122,14 121,19 C120,25 113,28 108,26 Z" fill="none" stroke="#25D366" stroke-width="1.6" stroke-linejoin="round"/>

    <circle cx="162" cy="18" r="18" fill="#FFFFFF" stroke="#1877F2" stroke-width="1.6"/>
    <text x="162" y="24" text-anchor="middle" class="manrope" font-size="15" fill="#1877F2" font-weight="700">f</text>

    <rect x="196" y="6" width="122" height="24" rx="12" fill="#FFFFFF" stroke="#DCEFE3" stroke-width="1.4"/>
    <circle cx="210" cy="18" r="7" fill="#2E9E4F"/>
    <path d="M207,18 L209,20 L214,15" stroke="#FFFFFF" stroke-width="1.6" fill="none"/>
    <text x="224" y="22" class="manrope" font-size="10" fill="#163C2B" opacity="0.7">Publicar ao salvar</text>
  </g>

  <!-- footer -->
  <rect x="0" y="782" width="390" height="62" fill="#F5FBFF"/>
  <rect x="24" y="782" width="342" height="48" rx="16" fill="#2E9E4F"/>
  <text x="195" y="812" text-anchor="middle" class="manrope" font-size="15" font-weight="700" fill="#FFFFFF">Salvar plantio</text>

  <rect x="150" y="828" width="90" height="4" rx="2" fill="#163C2B" opacity="0.3"/>
</svg>
